name: Build Custom FFmpeg (limaalef)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: 'Tag/Branch do FFmpeg (vazio = última release estável, ou digite "master")'
        required: false
        default: ''
      force_build:
        description: 'Forçar recompilação mesmo se a release já existir'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Silencia avisos de transição Node 20 -> Node 24 nas actions oficiais
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_win64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Detectar versão do FFmpeg
        id: check_version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.ffmpeg_ref }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          set +o pipefail
          if [ -n "$INPUT_REF" ]; then
            TARGET_REF="$INPUT_REF"
          else
            # Busca a última tag de release estável do espelho oficial no GitHub (mais rápido e confiável que git.ffmpeg.org)
            TARGET_REF=$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git \
              | awk -F'/' '{print $3}' \
              | grep -E '^n[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V | tail -n1)
          fi

          if [ -z "$TARGET_REF" ]; then
            TARGET_REF="master"
          fi

          if [ "$TARGET_REF" = "master" ]; then
            COMMIT_HASH=$(git ls-remote https://github.com/FFmpeg/FFmpeg.git refs/heads/master | cut -c1-7)
            CLEAN_VER="git-${COMMIT_HASH}"
            RELEASE_TAG="ffmpeg-${CLEAN_VER}-limaalef"
          else
            CLEAN_VER="${TARGET_REF#n}"
            RELEASE_TAG="ffmpeg-v${CLEAN_VER}-limaalef"
          fi

          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "Release $RELEASE_TAG já publicada. Encerrando."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nova build necessária: $RELEASE_TAG (ref: $TARGET_REF)"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache das bibliotecas compiladas (win64_prefix)
        if: steps.check_version.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/build_win64/win64_prefix
          key: win64-prefix-v3-${{ hashFiles('build_ffmpeg_win64.sh') }}

      - name: Compilar FFmpeg e bibliotecas
        if: steps.check_version.outputs.should_build == 'true'
        env:
          FFMPEG_BRANCH: ${{ steps.check_version.outputs.target_ref }}
        run: |
          # Remove quebras de linha CRLF do Windows caso existam no script
          sed -i 's/\r$//' build_ffmpeg_win64.sh
          chmod +x build_ffmpeg_win64.sh
          ./build_ffmpeg_win64.sh

      - name: Exibir log de erro detalhado (se a compilação falhar)
        if: failure()
        run: |
          echo "=== ÚLTIMAS 100 LINHAS DO BUILD.LOG ==="
          tail -n 100 ~/build_win64/build.log || true
          echo "=== ÚLTIMAS 80 LINHAS DO FFBUILD/CONFIG.LOG (SE EXISTIR) ==="
          tail -n 80 ~/build_win64/src/ffmpeg/ffbuild/config.log || true

      - name: Empacotar binários e gerar notas da versão
        if: steps.check_version.outputs.should_build == 'true'
        id: package
        run: |
          OUT_BIN="$HOME/build_win64/ffmpeg_out/bin"
          PREFIX_BIN="$HOME/build_win64/win64_prefix/bin"
          ZIP_NAME="ffmpeg-${{ steps.check_version.outputs.clean_ver }}-win64-static-limaalef.zip"

          # Copia o mpeghDecoder.exe, mpeghUIManager.exe e quaisquer outras ferramentas do prefix para a pasta bin final
          cp -f "$PREFIX_BIN"/*.exe "$OUT_BIN"/ 2>/dev/null || true
          
          # Garante que o ffplay.exe também foi copiado se gerado em subpastas
          find "$HOME/build_win64/src/ffmpeg" -name "ffplay.exe" -exec cp -f {} "$OUT_BIN"/ \; 2>/dev/null || true

          cd "$OUT_BIN"
          # Compacta todos os executáveis (.exe) juntos no .zip final
          7z a "$GITHUB_WORKSPACE/$ZIP_NAME" *.exe

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          cat > "$GITHUB_WORKSPACE/release_notes.md" << 'EOF'
          ### FFmpeg ${{ steps.check_version.outputs.clean_ver }} (Windows x64 Static) — Build by **limaalef**

          * **Binários incluídos:** \`ffmpeg.exe\`, \`ffprobe.exe\`, \`ffplay.exe\`, \`mpeghDecoder.exe\`, \`mpeghUIManager.exe\`
          * **Compilador:** MinGW-w64 GCC POSIX (Static)
          * **DTV / TV 3.0:** `liblcevc-dec`, `libmpeghdec`, `vvc` (nativo), `libaribb24`, `libxml2` (DASH)
          * **Vídeo & Imagem:** `libx264`, `libx265` (8/10/12-bit), `libvpx`, `libdav1d`, `libsvtav1`, `nvenc`, `d3d11va`, `png`, `mjpeg`, `libwebp`, `libopenjpeg`, `libzimg`
          * **Áudio & Legendas:** `libfdk-aac`, `libopus`, `libvorbis`, `libmp3lame`, `libsoxr`, `libass`, `libharfbuzz`, `libfreetype`, `libfribidi`
          EOF

      - name: Publicar Release no GitHub
        if: steps.check_version.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.check_version.outputs.release_tag }}"
          ZIP_PATH="$GITHUB_WORKSPACE/${{ steps.package.outputs.zip_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$ZIP_PATH" \
            --title "FFmpeg ${{ steps.check_version.outputs.clean_ver }} Win64 Static (by limaalef)" \
            --notes-file "$GITHUB_WORKSPACE/release_notes.md" \
            --latest
